name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # imap: AddressList is tested against imap_rfc822_parse_adrlist() (skipped if not available)
          extensions: mbstring, pdo_sqlite, posix, imap
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  database:
    # throttle tests against a real database, as SQLite neither locks records nor enforces column sizes
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mysql:8.4', 'mysql:9.7', 'mariadb:11.4']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    env:
      TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, pdo_sqlite, posix
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Wait for database
        run: |
          for _ in $(seq 30); do
            php -r 'new PDO(getenv("TEST_MYSQL_DSN"), getenv("TEST_MYSQL_USER"), getenv("TEST_MYSQL_PASSWORD"));' && exit 0
            sleep 2
          done
          exit 1

      - name: Run tests
        run: vendor/bin/pest

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  prepend:
    # prepend.php is the auto_prepend_file of all PHP versions installed on a server
    name: prepend.php on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: php -l prepend.php

      - name: Run
        run: |
          # shellcheck disable=SC2016 # PHP code, not expanded by the shell
          echo '<?php echo getenv("HTTP_HOST"), "|", var_export(getenv("REMOTE_ADDR"), true), "|", var_export(isset($envVars), true);' > /tmp/test.php
          output=$(HTTP_HOST='www.example.com(){ :;};' php -d error_reporting=E_ALL -d display_errors=1 -d auto_prepend_file=prepend.php /tmp/test.php)
          echo "$output"
          test "$output" = "www.example.com :|false|false"
