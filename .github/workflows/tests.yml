name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, posix
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  prepend:
    # prepend.php is the auto_prepend_file of all PHP versions installed on a server
    name: prepend.php on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: php -l prepend.php

      - name: Run
        run: |
          echo '<?php echo getenv("HTTP_HOST"), "|", var_export(getenv("REMOTE_ADDR"), true), "|", var_export(isset($envVars), true);' > /tmp/test.php
          output=$(HTTP_HOST='www.example.com(){ :;};' php -d error_reporting=E_ALL -d display_errors=1 -d auto_prepend_file=prepend.php /tmp/test.php)
          echo "$output"
          test "$output" = "www.example.com :|false|false"
